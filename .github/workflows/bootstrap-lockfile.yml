name: Bootstrap lockfile

on:
  push:
    branches:
      - stage-0/safety-ci
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.ref == 'refs/heads/stage-0/safety-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-0/safety-ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate or refresh package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: bootstrap package lock"
          git push origin HEAD:stage-0/safety-ci
